[config]
reload_apps = false

[templates.quickshell]
input_path = "templates/serpantinum_matugen_colors.json.template"
output_path = "~/.local/state/serpantinum/qs_colors.json"

[templates.fastfetch]
input_path = "templates/fastfetch.jsonc.template"
output_path = "~/.config/fastfetch/config.jsonc"

[templates.kitty]
input_path = "templates/kitty/kity-colors.conf"
output_path = "~/.config/kitty/colors.conf"

[templates.kitty-theme]
input_path = "templates/kitty/kity-colors.conf"
output_path = "~/.config/kitty/themes/Matugen.conf"

[templates.cava]
input_path = "templates/cava-colors.ini.template"
output_path = "~/.config/cava/config"

[templates.vesktop-midnight]
input_path = "templates/discord/discord-midnight.css"
output_path = "~/.config/vesktop/themes/midnight-discord.css"

[templates.vesktop-system24]
input_path = "templates/discord/system24.css"
output_path = "~/.config/vesktop/themes/system24.css"

[templates.gtk3]
input_path = "templates/gtk/gtk-colors.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "templates/gtk/gtk-colors.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt5ct]
input_path = "templates/qt/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
input_path = "templates/qt/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.hyprland]
input_path = "templates/hyprland/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.spotify]
input_path = "templates/spotify/spicetify.ini"
output_path = "~/.config/spicetify/Themes/Sleek/color.ini"

[templates.kcolorscheme]
input_path = "templates/kcolorscheme/kde.colors"
output_path = "~/.local/share/color-schemes/Matugen.colors"

