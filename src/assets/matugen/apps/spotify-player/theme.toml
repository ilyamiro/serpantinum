[[themes]]
name = "serpantinum"

[themes.palette]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
black = "{{colors.surface_variant.default.hex}}"
red = "{{colors.error.default.hex}}"
green = "{{colors.primary.default.hex}}"
yellow = "{{colors.tertiary.default.hex}}"
blue = "{{colors.secondary.default.hex}}"
magenta = "{{colors.inverse_primary.default.hex}}"
cyan = "{{colors.tertiary_fixed_dim.default.hex}}"
white = "{{colors.on_surface_variant.default.hex}}"
bright_black = "{{colors.outline.default.hex}}"
bright_red = "{{colors.error_container.default.hex}}"
bright_green = "{{colors.primary_fixed.default.hex}}"
bright_yellow = "{{colors.tertiary_fixed.default.hex}}"
bright_blue = "{{colors.secondary_fixed.default.hex}}"
bright_magenta = "{{colors.primary_container.default.hex}}"
bright_cyan = "{{colors.tertiary_container.default.hex}}"
bright_white = "{{colors.on_surface.default.hex}}"

[themes.component_style]
block_title = { fg = "Green", modifiers = ["Bold"] }
border = { fg = "BrightBlack" }
playback_track = { fg = "BrightWhite", modifiers = ["Bold"] }
playback_artists = { fg = "Blue" }
playback_album = { fg = "Yellow" }
playback_metadata = { fg = "BrightBlack" }
playback_progress_bar = { fg = "Green", bg = "Black" }
current_playing = { fg = "Green", modifiers = ["Bold"] }
page_desc = { fg = "Blue", modifiers = ["Bold"] }
table_header = { fg = "Green" }
selection = { modifiers = ["Bold", "Reversed"] }
secondary_row = { bg = "Black" }
like = { fg = "Red" }
lyrics_played = { modifiers = ["Dim"] }
