[Metadata]
Name=Serpantinum
Version=1
Author=Serpantinum
Description=Colors from the Serpantinum shell
ScaleWithDPI=True

[InputPanel]
NormalColor={{colors.on_surface.default.hex}}
HighlightCandidateColor={{colors.on_secondary_container.default.hex}}
HighlightColor={{colors.primary.default.hex}}
HighlightBackgroundColor={{colors.secondary_container.default.hex}}
FullWidthHighlight=True
PageButtonAlignment=Bottom

[InputPanel/Background]
Color={{colors.surface_container.default.hex}}
BorderColor={{colors.outline_variant.default.hex}}
BorderWidth=2

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color={{colors.secondary_container.default.hex}}

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=6
Bottom=6

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/TextMargin]
Left=8
Right=8
Top=6
Bottom=6

[Menu]
NormalColor={{colors.on_surface.default.hex}}
HighlightCandidateColor={{colors.on_secondary_container.default.hex}}
Spacing=2

[Menu/Background]
Color={{colors.surface_container.default.hex}}
BorderColor={{colors.outline_variant.default.hex}}
BorderWidth=2

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color={{colors.secondary_container.default.hex}}

[Menu/Highlight/Margin]
Left=8
Right=8
Top=4
Bottom=4

[Menu/Separator]
Color={{colors.outline_variant.default.hex}}

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/TextMargin]
Left=8
Right=8
Top=4
Bottom=4
