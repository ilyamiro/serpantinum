"ui.background" = { bg = "bg" }
"ui.text" = "fg"
"ui.text.focus" = { fg = "fg", modifiers = ["bold"] }
"ui.text.inactive" = "muted"
"ui.cursor" = { fg = "on_accent", bg = "accent" }
"ui.cursor.primary" = { fg = "on_accent", bg = "accent" }
"ui.cursor.match" = { fg = "accent", modifiers = ["underlined"] }
"ui.cursorline.primary" = { bg = "bg_soft" }
"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }
"ui.linenr" = "outline"
"ui.linenr.selected" = { fg = "accent", modifiers = ["bold"] }
"ui.statusline" = { fg = "fg", bg = "bg_high" }
"ui.statusline.inactive" = { fg = "muted", bg = "bg_soft" }
"ui.statusline.normal" = { fg = "on_accent", bg = "accent", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "on_secondary", bg = "secondary", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "on_tertiary", bg = "tertiary", modifiers = ["bold"] }
"ui.popup" = { fg = "fg", bg = "bg_high" }
"ui.window" = "outline_variant"
"ui.help" = { fg = "fg", bg = "bg_high" }
"ui.menu" = { fg = "fg", bg = "bg_high" }
"ui.menu.selected" = { fg = "on_accent", bg = "accent" }
"ui.menu.scroll" = { fg = "outline", bg = "bg_high" }
"ui.virtual" = "outline_variant"
"ui.virtual.whitespace" = "outline_variant"
"ui.virtual.ruler" = { bg = "bg_soft" }
"ui.virtual.inlay-hint" = { fg = "outline" }
"ui.virtual.jump-label" = { fg = "tertiary", modifiers = ["bold"] }
"ui.bufferline" = { fg = "muted", bg = "bg_soft" }
"ui.bufferline.active" = { fg = "fg", bg = "bg_high", modifiers = ["bold"] }

"comment" = { fg = "outline", modifiers = ["italic"] }
"keyword" = "accent"
"keyword.control" = "accent"
"function" = "secondary"
"function.macro" = "tertiary"
"string" = "tertiary"
"string.special" = "tertiary_fixed"
"constant" = "accent_fixed"
"constant.numeric" = "tertiary_fixed"
"constant.character.escape" = "secondary_fixed"
"type" = "secondary_fixed"
"type.builtin" = "secondary_fixed"
"constructor" = "secondary"
"variable" = "fg"
"variable.builtin" = "accent_fixed"
"variable.parameter" = "fg_variant"
"variable.other.member" = "fg_variant"
"label" = "tertiary"
"namespace" = "secondary_fixed"
"attribute" = "tertiary"
"operator" = "fg_variant"
"punctuation" = "outline"
"tag" = "accent"
"special" = "tertiary"

"markup.heading" = { fg = "accent", modifiers = ["bold"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "tertiary", modifiers = ["underlined"] }
"markup.link.text" = "secondary"
"markup.list" = "accent"
"markup.quote" = { fg = "fg_variant", modifiers = ["italic"] }
"markup.raw" = "tertiary"

"diff.plus" = "secondary"
"diff.minus" = "error"
"diff.delta" = "tertiary"

"error" = "error"
"warning" = "tertiary"
"info" = "secondary"
"hint" = "outline"
"diagnostic.error" = { underline = { color = "error", style = "curl" } }
"diagnostic.warning" = { underline = { color = "tertiary", style = "curl" } }
"diagnostic.info" = { underline = { color = "secondary", style = "curl" } }
"diagnostic.hint" = { underline = { color = "outline", style = "curl" } }

[palette]
bg = "{{colors.surface.default.hex}}"
bg_soft = "{{colors.surface_container_low.default.hex}}"
bg_high = "{{colors.surface_container_high.default.hex}}"
fg = "{{colors.on_surface.default.hex}}"
fg_variant = "{{colors.on_surface_variant.default.hex}}"
muted = "{{colors.on_surface_variant.default.hex}}"
outline = "{{colors.outline.default.hex}}"
outline_variant = "{{colors.outline_variant.default.hex}}"
selection = "{{colors.secondary_container.default.hex}}"
accent = "{{colors.primary.default.hex}}"
on_accent = "{{colors.on_primary.default.hex}}"
accent_fixed = "{{colors.primary_fixed_dim.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
on_secondary = "{{colors.on_secondary.default.hex}}"
secondary_fixed = "{{colors.secondary_fixed_dim.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
on_tertiary = "{{colors.on_tertiary.default.hex}}"
tertiary_fixed = "{{colors.tertiary_fixed_dim.default.hex}}"
error = "{{colors.error.default.hex}}"
