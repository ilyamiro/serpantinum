# serpantinum: your own keybinds settings for mango.
# This file is yours. It loads before config/keybinds.
# Serpantinum installs and updates never touch this file.
#
# Replace a default bind: use bind= with the same key.
#   bind=SUPER,Q,spawn,kitty
# Remove a default bind: bind the key to a harmless command.
#   bind=SUPER,Q,spawn,true
# Note: this file loads before the defaults, so a bind here that uses the
# allow-conflict flag lets the default bind run as well.
