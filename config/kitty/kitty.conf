# Kitty Configuration - macOS Glass & Smooth Motion Aesthetic

# Typography: Apple SF Mono (Family name + Postscript style)
font_family      family="Liga SFMono Nerd Font" style="Medium"
bold_font        family="Liga SFMono Nerd Font" style="Bold"
italic_font      family="Liga SFMono Nerd Font" style="Medium Italic"
bold_italic_font family="Liga SFMono Nerd Font" style="Bold Italic"
font_size        13.0

# Colors: Dynamically themed from Serpantinum
include colors.conf

# Transparency & Background Blur
background_opacity 0.60
background_blur 32

# Padding
window_padding_width 12

# Window decoration
confirm_os_window_close 0
hide_window_decorations yes
remember_window_size no

# Ultra Smooth Animated Cursor & Beautiful Trail
cursor_shape beam
cursor_beam_thickness 2.2
cursor_blink_interval 0.5

# Cursor Ghosting / Trail
cursor_trail 5
cursor_trail_decay 0.05 0.35
cursor_trail_start_threshold 1

# Performance (165 FPS)
repaint_delay 6
input_delay 1
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0
